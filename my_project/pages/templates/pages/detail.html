{% extends 'pages/base.html' %}

{% block title %}
{{ article.title }}
{% endblock %}

{% block content %}

<div class="container mt-5">

    <h1>{{ article.title }}</h1>

    <p>
        {{ article.description }}
    </p>

    <p>
        Цена: {{ article.price }}
    </p>

    <p>
        Создано: {{ article.created_at }}
    </p>

    <a
        href="{% url 'home' %}"
        class="btn btn-secondary"
    >
        Назад
    </a>

</div>

{% endblock %}
