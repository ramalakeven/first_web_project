version: "3.9"

services:
  db:
    image: postgres:16
    container_name: django_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: django_db
      POSTGRES_USER: django_user
      POSTGRES_PASSWORD: django_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: